        - heading "Engineering Decisions" [level=1] [ref=e26]
      - paragraph [ref=e27]: A public ADR (Architecture Decision Record) database. Every significant technical decision I've made — context, options, reasoning, tradeoffs, and outcome.
    - generic [ref=e28]:
      - article [ref=e29]:
        - generic [ref=e30]:
          - generic [ref=e31]:
            - text: ADR-001
            - heading "Go for warehouse search service, not Java" [level=2] [ref=e32]
          - generic [ref=e33]: Accepted
        - generic [ref=e34]:
          - generic [ref=e35]:
            - text: Context
            - paragraph [ref=e36]: OZON needed a high-concurrency search microservice for 200M warehouse items. Java/Spring was the team default.
          - generic [ref=e37]:
            - text: Options considered
            - generic [ref=e38]:
              - generic [ref=e39]: ✓ Go
              - generic [ref=e40]: Java/Spring Boot
              - generic [ref=e41]: Python/FastAPI
          - generic [ref=e42]:
            - text: Reasoning
            - paragraph [ref=e43]: Go's goroutine model handles 10K concurrent connections with ~50MB RAM vs. Java's thread-per-request model needing ~2GB. Single binary deployment eliminates JVM overhead. The team already knew Go.
          - generic [ref=e44]:
            - text: Tradeoffs
            - paragraph [ref=e45]: Fewer libraries than Java ecosystem. String manipulation is more verbose. No generics at the time (pre-Go 1.18).
          - generic [ref=e46]:
            - text: Outcome
            - paragraph [ref=e47]: Service runs on a single 2-core instance serving 500 RPS at P95 < 80ms. Java equivalent would have needed 4x the hardware.
        - generic [ref=e48]:
