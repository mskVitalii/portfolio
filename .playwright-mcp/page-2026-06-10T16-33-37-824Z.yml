      - article [ref=e76]:
        - generic [ref=e77]:
          - generic [ref=e78]:
            - text: ADR-003
            - heading "Kafka for search index updates, not polling" [level=2] [ref=e79]
          - generic [ref=e80]: Accepted
        - generic [ref=e81]:
          - generic [ref=e82]:
            - text: Context
            - paragraph [ref=e83]: "ES index needs to stay current with the product catalog. Options: poll DB, use CDC, or event stream."
          - generic [ref=e84]:
            - text: Options considered
            - generic [ref=e85]:
              - generic [ref=e86]: DB polling
              - generic [ref=e87]: PostgreSQL CDC (Debezium)
              - generic [ref=e88]: ✓ Kafka events from catalog service
          - generic [ref=e89]:
            - text: Reasoning
            - paragraph [ref=e90]: Catalog service already published events to Kafka. Consuming them is simpler than setting up Debezium CDC. Kafka's consumer group semantics allow replay on failure. Sub-2s lag is acceptable.
          - generic [ref=e91]:
            - text: Tradeoffs
            - paragraph [ref=e92]: Depends on catalog service publishing correct events (coupling). Requires handling out-of-order events. CDC would be more robust for high-volume bulk updates.
          - generic [ref=e93]:
            - text: Outcome
            - paragraph [ref=e94]: Works well for normal traffic. Exposed a gap during bulk catalog updates where event ordering caused temporary stale data.
