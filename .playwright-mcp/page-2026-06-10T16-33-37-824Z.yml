      - article [ref=e52]:
        - generic [ref=e53]:
          - generic [ref=e54]:
            - text: ADR-002
            - heading "ElasticSearch over PostgreSQL full-text for search" [level=2] [ref=e55]
          - generic [ref=e56]: Accepted
        - generic [ref=e57]:
          - generic [ref=e58]:
            - text: Context
            - paragraph [ref=e59]: PostgreSQL FTS was hitting 8-10s at 200M documents. A search engine was clearly needed.
          - generic [ref=e60]:
            - text: Options considered
            - generic [ref=e61]:
              - generic [ref=e62]: ✓ ElasticSearch
              - generic [ref=e63]: PostgreSQL full-text
              - generic [ref=e64]: Typesense
              - generic [ref=e65]: Meilisearch
          - generic [ref=e66]:
            - text: Reasoning
            - paragraph [ref=e67]: ES supports custom analyzers for Russian transliteration (a hard requirement). Fuzzy matching and phonetic analysis work out of the box. Horizontal sharding is transparent. Team had prior experience.
          - generic [ref=e68]:
            - text: Tradeoffs
            - paragraph [ref=e69]: Operational complexity vs. Postgres (separate cluster, JVM memory). Eventual consistency between Postgres (source of truth) and ES (search replica). Complex upgrade path.
          - generic [ref=e70]:
            - text: Outcome
            - paragraph [ref=e71]: Search latency dropped from 8-10s to <500ms P99. Custom analyzer solved transliteration with ~2% false positive rate.
        - generic [ref=e72]:
