          - generic [ref=e98]: ElasticSearch
      - article [ref=e99]:
        - generic [ref=e100]:
          - generic [ref=e101]:
            - text: ADR-004
            - heading "MQTT over HTTP for camera-to-backend communication" [level=2] [ref=e102]
          - generic [ref=e103]: Accepted
        - generic [ref=e104]:
          - generic [ref=e105]:
            - text: Context
            - paragraph [ref=e106]: Parking cameras need to push occupancy events to the backend. Cameras are on a campus LAN.
          - generic [ref=e107]:
            - text: Options considered
            - generic [ref=e108]:
              - generic [ref=e109]: HTTP polling
              - generic [ref=e110]: HTTP webhooks from cameras
              - generic [ref=e111]: MQTT pub/sub
              - generic [ref=e112]: WebSockets
          - generic [ref=e113]:
            - text: Reasoning
            - paragraph [ref=e114]: Cameras are resource-constrained (embedded C, limited RAM). MQTT is designed for IoT — small payload overhead, persistent connections, QoS levels for at-least-once delivery. Single broker handles hundreds of cameras.
          - generic [ref=e115]:
            - text: Tradeoffs
            - paragraph [ref=e116]: Adds MQTT broker as infrastructure dependency. Topic schema needs discipline or becomes chaotic. Harder to debug than REST.
          - generic [ref=e117]:
            - text: Outcome
            - paragraph [ref=e118]: Event latency <200ms from camera to dashboard. Broker handles 200 cameras with <5% CPU on a modest VM.
