          - heading "The Microservice That Became a Monolith" [level=2] [ref=e29]
          - generic [ref=e30]: Medium impact
        - generic [ref=e31]:
          - generic [ref=e32]:
            - text: Problem
            - paragraph [ref=e33]: Split a perfectly fine service into 6 microservices because 'that's how Netflix does it'.
          - generic [ref=e34]:
            - img [ref=e35]
            - generic [ref=e37]:
              - text: Mistake
              - paragraph [ref=e38]: Applied enterprise patterns to a system with 3 users and no scaling requirements.
          - generic [ref=e39]:
            - img [ref=e40]
            - generic [ref=e42]:
              - text: Consequence
              - paragraph [ref=e43]: Doubled deployment complexity, increased latency by 40ms per request, and took 3x longer to add features.
          - generic [ref=e44]:
            - img [ref=e45]
            - generic [ref=e47]:
              - text: Fix
              - paragraph [ref=e48]: Merged all 6 back into 2 services with clear domain boundaries. Much simpler, just as fast.
          - generic [ref=e49]:
            - text: Lesson
            - paragraph [ref=e50]: Microservices solve an organizational scaling problem, not a technical one. At small scale they're almost always a net negative.
        - generic [ref=e51]:
          - generic [ref=e52]: Architecture
          - generic [ref=e53]: Distributed Systems
      - article [ref=e54]:
        - generic [ref=e55]:
          - heading "ElasticSearch Index Design Mistake" [level=2] [ref=e56]
          - generic [ref=e57]: High impact
        - generic [ref=e58]:
          - generic [ref=e59]:
            - text: Problem
            - paragraph [ref=e60]: Designed an ES index without thinking about update patterns — built it optimised for reads.
          - generic [ref=e61]:
            - img [ref=e62]
            - generic [ref=e64]:
              - text: Mistake
              - paragraph [ref=e65]: Didn't account for partial document updates. Every update required re-indexing the full document including nested arrays.
          - generic [ref=e66]:
            - img [ref=e67]
            - generic [ref=e69]:
              - text: Consequence
              - paragraph [ref=e70]: Index update rate hit ES write throughput limits during catalog bulk updates. 15-minute indexing lag appeared.
          - generic [ref=e71]:
            - img [ref=e72]
            - generic [ref=e74]:
              - text: Fix
              - paragraph [ref=e75]: Denormalized the nested data into separate indices. Introduced a Kafka topic as a buffer to smooth out write spikes.
          - generic [ref=e76]:
            - text: Lesson
            - paragraph [ref=e77]: Design indices for your update patterns first, query patterns second. Measure write amplification before going live.
        - generic [ref=e78]:
          - generic [ref=e79]: ElasticSearch
          - generic [ref=e80]: Search
          - generic [ref=e81]: Performance
      - article [ref=e82]:
        - generic [ref=e83]:
          - 'heading "Wrong Scaling Decision: Vertical Instead of Horizontal" [level=2] [ref=e84]'
          - generic [ref=e85]: Medium impact
        - generic [ref=e86]:
          - generic [ref=e87]:
            - text: Problem
            - paragraph [ref=e88]: PostgreSQL queries getting slow. Added more RAM and CPU to the instance.
          - generic [ref=e89]:
            - img [ref=e90]
            - generic [ref=e92]:
              - text: Mistake
              - paragraph [ref=e93]: The real problem was missing indices and an N+1 query from the ORM. Vertical scaling masked it.
          - generic [ref=e94]:
            - img [ref=e95]
            - generic [ref=e97]:
              - text: Consequence
              - paragraph [ref=e98]: Spent budget on hardware, queries got marginally faster, N+1 came back 2 months later at higher scale.
          - generic [ref=e99]:
            - img [ref=e100]
            - generic [ref=e102]:
              - text: Fix
              - paragraph [ref=e103]: Profiled queries with pg_stat_statements, added composite indices, rewrote the hot ORM paths to use raw SQL joins.
          - generic [ref=e104]:
            - text: Lesson
            - paragraph [ref=e105]: Profile before scaling. Hardware masks problems; it doesn't solve them.
        - generic [ref=e106]:
