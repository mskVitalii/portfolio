          - generic [ref=e117]:
            - img [ref=e118]
            - generic [ref=e120]:
              - text: Mistake
              - paragraph [ref=e121]: Never talked to users. Assumed the feature was needed based on a single offhand comment.
          - generic [ref=e122]:
            - img [ref=e123]
            - generic [ref=e125]:
              - text: Consequence
