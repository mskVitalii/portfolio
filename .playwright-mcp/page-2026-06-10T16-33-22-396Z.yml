    - article [ref=e55]:
      - heading "Context" [level=2] [ref=e56]
      - paragraph [ref=e57]:
        - text: Infineon's Dresden campus has hundreds of parking spaces spread across several lots. Before this project, the company was evaluating commercial parking guidance vendors — the best offer was
        - strong [ref=e58]: €480,000/year
        - text: in licensing and maintenance fees.
      - paragraph [ref=e59]: "The alternative: build it in-house."
      - heading "What was built" [level=2] [ref=e60]
      - paragraph [ref=e61]: "A full parking guidance system, from hardware to dashboard:"
      - list [ref=e62]:
        - listitem [ref=e63]:
          - strong [ref=e64]: Embedded firmware
          - text: in C running on IP cameras — performs ANPR (Automatic Number Plate Recognition) and occupancy counting without sending video streams over the network.
        - listitem [ref=e65]:
          - strong [ref=e66]: Python microservices
          - text: aggregate zone occupancy, handle authentication, and serve the REST/WebSocket API.
        - listitem [ref=e67]:
          - strong [ref=e68]: C# device management layer
          - text: handles camera provisioning, firmware updates, and health monitoring.
        - listitem [ref=e69]:
          - strong [ref=e70]: React + TypeScript dashboard
          - text: gives security staff and drivers a real-time map of available spaces.
      - heading "Architecture" [level=2] [ref=e71]
      - code [ref=e73]: ┌──────────────────┐ MQTT ┌────────────────────┐ │ IP Camera (C) │ ────────────► │ Python Backend │ │ ANPR + Count │ │ (Event Processor) │ └──────────────────┘ └────────┬───────────┘ │ WebSocket ┌────────▼───────────┐ │ React Dashboard │ │ (Real-time map) │ └────────────────────┘
      - paragraph [ref=e74]: Cameras run the detection locally (edge computing) — only occupancy events are sent over the network, not video. This keeps bandwidth low and avoids GDPR issues with centralized video storage.
      - heading "Challenges" [level=2] [ref=e75]
      - paragraph [ref=e76]:
        - strong [ref=e77]: The embedded + web bridge.
        - text: Writing C for resource-constrained cameras and then wiring it to a React SPA required designing a clean protocol boundary. MQTT was chosen over HTTP polling to keep latency under 500ms.
      - paragraph [ref=e78]:
        - strong [ref=e79]: Graceful degradation.
        - text: If a camera goes offline, the system doesn't show stale data — it marks the zone as "unknown" and the dashboard reflects uncertainty rather than lying.
      - paragraph [ref=e80]:
        - strong [ref=e81]: Multi-tenant configuration.
        - text: Different parking lots have different layouts. A configuration-as-data approach means adding a new lot is a JSON file, not a code change.
      - heading "Outcome" [level=2] [ref=e82]
      - paragraph [ref=e83]:
        - text: The system went live on campus.
        - strong [ref=e84]: €480,000/year saved
        - text: vs. the vendor quote. The barrier control subsystem added independently serves
        - strong [ref=e85]: 8,000 registered users
        - text: with
        - strong [ref=e86]: 3,000 monthly active
        - text: .
      - heading "What I'd do differently" [level=2] [ref=e87]
      - paragraph [ref=e88]: The MQTT topic structure grew organically and became inconsistent across camera types. I'd define the topic schema upfront as a formal contract and version it from day one.
